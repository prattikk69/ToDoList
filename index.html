<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My to do lists</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <span class="orb orb1"></span>
    <span class="orb orb2"></span>
    <span class="orb orb3"></span>

    <div class="container glassMorphism">
        <nav><div class="user glassMorphismText">User</div>
            <menu><ul>
                <li id="deleteAllTask" class="glassMorphismText">Delete All Tasks</li>
            </ul></menu>
        </nav>
            <div class="inputField">
                <input class="glassMorphismInput" type="text" name="tasks" id="inputTask" placeholder="Enter tasks here...">
                <button class="glassMorphismInput" id="addTask">Add Task</button>
            </div>
            <p>To do list:</p>
            <br>
        <div class="taskContainer"><ul class="glassMorphismInput" id="taskList"></ul></div>
        <div class="keyboard glassMorphismText" onclick="setFocus()"><i title="open keyboard" class="far fa-keyboard"></i></div>
    </div>
    <div class="name glassMorphism">
        <h2>Enter your name</h2>
        <input class="glassMorphismInput" type="text" name="nameInput" id="nameInput" placeholder="User Name...">
        <button class="glassMorphismInput" id="nameBtn">Set Name</button>
        <button class="glassMorphismInput" onclick="cancel()">Cancel</button>
    </div>
    <script src="script.js">
    </script>
</body>
</html>
